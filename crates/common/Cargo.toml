[package]
name = "zkasper-common"
version.workspace = true
edition.workspace = true

[features]
default = ["std"]
std = []
test-utils = ["dep:blst"]
count-ops = []

[dependencies]
serde = { workspace = true }
serde-big-array = "0.5"
bincode = { workspace = true }
ziskos = { workspace = true }
# Test fixtures need real public keys: the accumulator leaf commits to the
# decompressed point, so a synthetic 48-byte pattern is no longer a valid leaf.
blst = { version = "0.3", optional = true }
