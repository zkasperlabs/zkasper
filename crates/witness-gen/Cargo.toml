[package]
name = "zkasper-witness-gen"
version.workspace = true
edition.workspace = true

[lib]
name = "zkasper_witness_gen"
path = "src/lib.rs"

[[bin]]
name = "zkasper-witness-gen"
path = "src/main.rs"

[[bin]]
name = "gen-test-witness"
path = "src/bin/gen_test_witness.rs"

[[bin]]
name = "gen-committee-witness"
path = "src/bin/gen_committee_witness.rs"

[[bin]]
name = "zkasperd"
path = "src/bin/zkasperd.rs"

[[bin]]
name = "zkasper-prover-server"
path = "src/bin/prover_server.rs"

[[bin]]
name = "zkasper-init-point"
path = "src/bin/gen_init_point.rs"

# Derives a guest's verification key from its ELF. `scripts/bake_child_vks.sh`
# is the only caller; it needs `--features zisk-prover`.
[[bin]]
name = "zkasper-program-vk"
path = "src/bin/program_vk.rs"

[dependencies]
ziskos = { workspace = true }
zkasper-common = { path = "../common", features = ["test-utils"] }
# The guest crates are the circuits. The orchestrator runs them natively behind
# the `Prover` hook, so every witness it writes has already been checked by the
# same logic that will later prove it.
zkasper-epoch-diff-guest = { path = "../epoch-diff-guest" }
zkasper-slot-proof-guest = { path = "../slot-proof-guest" }
zkasper-justification-guest = { path = "../justification-guest" }
zkasper-finalization-guest = { path = "../finalization-guest" }
zkasper-aggregation-guest = { path = "../aggregation-guest" }
zkasper-stream-final-guest = { path = "../stream-final-guest" }
serde = { workspace = true, features = ["std"] }
serde_json = "1"
bincode = { workspace = true }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# Prometheus, the standard Rust stack for it. The exporter serves /metrics from
# the daemon itself; `push-gateway` is off because nothing here pushes, and it
# would pull in a second TLS implementation to do it.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-process = "2"
rayon = "1"
hex = "0.4"
async-trait = "0.1"
blst = "0.3"
# The proving stack, for the `zisk-prover` feature. Optional because it pulls in
# proofman, the pil2-stark C++ library and an MPI toolchain, none of which a
# witness-only run or `cargo test` needs. Whether it can drive a GPU is decided
# when it is built, by whether CUDA is visible; `--gpu` is a runtime flag on top.
zisk-sdk = { workspace = true, optional = true }

[features]
default = []
count-ops = ["zkasper-common/count-ops"]
zisk-prover = ["dep:zisk-sdk"]

[dev-dependencies]
zkasper-epoch-diff-guest = { path = "../epoch-diff-guest", features = ["count-ops"] }
zkasper-slot-proof-guest = { path = "../slot-proof-guest" }
zkasper-fcr-proof-guest = { path = "../fcr-proof-guest" }
zkasper-fcr-types = { path = "../fcr-types" }
zkasper-fcr-committee-guest = { path = "../fcr-committee-guest" }
zkasper-fcr-verifier = { path = "../fcr-verifier" }
fast_confirmation_core = { git = "https://github.com/dapplion/lighthouse.git", branch = "fcr-no-std" }
zkasper-justification-guest = { path = "../justification-guest" }
zkasper-finalization-guest = { path = "../finalization-guest" }
zkasper-aggregation-guest = { path = "../aggregation-guest" }
zkasper-stream-final-guest = { path = "../stream-final-guest" }
zkasper-common = { path = "../common", features = ["test-utils", "count-ops"] }
blst = "0.3"
tempfile = "3"
flate2 = "1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
