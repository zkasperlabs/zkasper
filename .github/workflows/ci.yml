name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned deliberately. syscall_poseidon2 lands in v0.16.0, zisk_verifier in
  # v0.18.0 and zisklib hash_to_curve in v1.0.0-alpha; zkasper needs all three,
  # and the cost model in BENCHMARKS.md is tied to a specific version.
  ZISK_VERSION: "1.1.0-alpha"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test-ssz:
    name: Test (SSZ state parsing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache SSZ test data
        uses: actions/cache@v4
        with:
          path: test_data/
          key: ssz-test-data-v2
      - name: Run SSZ state tests (mainnet + gnosis)
        run: cargo test --release --test ssz_file_tests -- --ignored --nocapture
        timeout-minutes: 15

  witness-gen:
    name: Witness generation smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate test witnesses for all proof types
        run: |
          for proof in bootstrap epoch-diff slot-proof justification finalization \
                       group-proof aggregation stream-final; do
            cargo run --release --bin gen-test-witness -- "$proof" "/tmp/${proof}_input.bin"
          done

  forge:
    name: Forge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        working-directory: crates/onchain-verifier
        run: forge install --no-git
      - name: Run Solidity tests
        working-directory: crates/onchain-verifier
        run: forge test -vvv

  zisk-emulator:
    name: Zisk emulator (${{ matrix.proof-type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The aggregation and stream-final guests are left out deliberately:
        # their test witnesses carry stub child proofs, which a guest rejects,
        # and a panicking guest does not return from ziskemu — reproduced here,
        # the aggregation guest was still running after 120 s on a witness the
        # host rejects in microseconds.
        #
        # Fixing it needs real child proofs in the fixture, which needs the 47 GB
        # proving key that a hosted runner does not have. The coverage lives in
        # `tests/zisk_proof_tests.rs` instead, which proves for real and checks
        # what the emulator cannot: that a proof is accepted only under its own
        # program's verification key.
        proof-type: [bootstrap, epoch-diff, slot-proof, group-proof, justification, finalization]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Zisk system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils jq curl build-essential qemu-system \
            libomp-dev libgmp-dev nlohmann-json3-dev protobuf-compiler uuid-dev \
            libgrpc++-dev libsecp256k1-dev libsodium-dev libpqxx-dev nasm \
            libopenmpi-dev openmpi-bin openmpi-common

      - name: Install Zisk toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/install.sh | bash
          "$HOME/.zisk/bin/ziskup" --version "${ZISK_VERSION}" --cpu --nokey -y
          echo "$HOME/.zisk/bin" >> "$GITHUB_PATH"

      - name: Generate test witness
        run: |
          cargo run --release --bin gen-test-witness -- ${{ matrix.proof-type }} /tmp/witness.bin
          python3 scripts/zisk_input.py /tmp/witness.bin /tmp/input.bin

      - name: Build guest ELF for Zisk
        run: cargo-zisk build --release -p zkasper-${{ matrix.proof-type }}-guest

      - name: Run in Zisk emulator
        run: |
          ziskemu -X \
            -e target/elf/riscv64ima-zisk-zkvm-elf/release/zkasper-${{ matrix.proof-type }}-guest \
            -i /tmp/input.bin

  bench:
    name: Precompile cost model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Zisk system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils jq curl build-essential \
            libomp-dev libgmp-dev nasm libopenmpi-dev openmpi-bin openmpi-common

      - name: Install Zisk toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/install.sh | bash
          "$HOME/.zisk/bin/ziskup" --version "${ZISK_VERSION}" --cpu --nokey -y
          echo "$HOME/.zisk/bin" >> "$GITHUB_PATH"

      # Re-measures the weights in BENCHMARKS.md, so a Zisk bump that shifts
      # them shows up here rather than silently invalidating the cost model.
      - name: Measure
        run: python3 scripts/bench.py --build

  zisk-prover:
    name: Zisk prover feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # zisk-sdk is a git dependency that links MPI and runs bindgen, so it
      # needs more than the other jobs. Installed one package per invocation:
      # a single apt call is atomic, so one unresolvable name would silently
      # take every other dependency with it.
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          for pkg in nasm libgmp-dev libomp-dev libopenmpi-dev openmpi-bin \
                     libsodium23 pkg-config clang libclang-dev libssl-dev
          do
            sudo apt-get install -y --no-install-recommends "$pkg"
          done
      # The real prover is feature-gated, so `cargo check --workspace` stays
      # green while it is broken. That has already happened once: a merge left
      # zisk_prover.rs uncompilable and Pipeline::stages() panicking on a
      # missing VK, and every other job passed.
      - run: cargo clippy --workspace --features zisk-prover --all-targets -- -D warnings

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings
