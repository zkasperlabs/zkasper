name: Zisk Proofs

# Full ZK proof generation + verification. Needs ~11GB RAM and ~8 min per proof.
# Runs nightly and on manual trigger. Requires a self-hosted runner with enough resources.
#
# This is a correctness check, not the product path: it shells out to `cargo-zisk`
# once per proof, so every proof here pays a cold start. The pipeline itself proves
# through `crates/witness-gen/src/zisk_prover.rs`, which initialises once and stays
# warm — see `crates/witness-gen/src/prover.rs` on why the difference is the claim.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 3 AM UTC daily

env:
  CARGO_TERM_COLOR: always
  ZISK_VERSION: "1.1.0-alpha"

jobs:
  prove:
    name: Prove (${{ matrix.proof-type }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        proof-type: [bootstrap, epoch-diff, slot-proof, justification, finalization]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Zisk toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/install.sh | bash
          # Pinned: installing whatever is on main means every run tests a
          # different prover, and the cost model in BENCHMARKS.md is tied to a
          # specific version.
          "$HOME/.zisk/bin/ziskup" --version "${ZISK_VERSION}" --provingkey --cpu -y
          echo "$HOME/.zisk/bin" >> "$GITHUB_PATH"

      - name: Run full proof pipeline
        run: bash scripts/test_zisk_proof.sh ${{ matrix.proof-type }}
        timeout-minutes: 60
